[project]
name = "hex-chess-board-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Szymon Górka", email = "55995692+AIn0n@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "omegaconf>=2.4.0",
    "solidpython2>=2.1.3",
    "streamlit-extras>=1.6.0",
]

[project.scripts]
generate = "hex_chess_board_generator:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "ruff>=0.17.4",
]
preview = [
    "ipykernel>=7.4.0",
    "jupyterscad>=1.0",
]
webpage = [
    "streamlit>=1.67.0",
]
